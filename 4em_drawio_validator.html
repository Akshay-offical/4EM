<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4EM Draw.io Live Validator</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f4f5f7; }
  #topbar {
    height: 48px; display:flex; align-items:center; justify-content:space-between;
    padding: 0 16px; background:#1f2937; color:#fff; font-size:14px;
  }
  #topbar .title { font-weight:600; letter-spacing:0.2px; }
  #topbar .status { font-size:12px; color:#9ca3af; }
  #topbar button {
    background:#374151; color:#fff; border:1px solid #4b5563; border-radius:6px;
    padding:6px 12px; font-size:12px; cursor:pointer; margin-left:8px;
  }
  #topbar button:hover { background:#4b5563; }
  #frame-wrap { position:relative; height: calc(100% - 48px); }
  iframe { border:0; width:100%; height:100%; display:block; background:#fff; }

  #toast-container {
    position:fixed; top:60px; right:16px; z-index:9999;
    display:flex; flex-direction:column; gap:10px; width:360px; max-width:90vw;
  }
  .toast {
    background:#fff; border-left:5px solid #dc2626; border-radius:8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15); padding:12px 14px 14px 14px;
    animation: slideIn .25s ease-out; font-size:13px; color:#111827;
  }
  .toast.valid { border-left-color:#16a34a; }
  .toast-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .toast-title { font-weight:700; font-size:13px; color:#b91c1c; }
  .toast.valid .toast-title { color:#15803d; }
  .toast-close { cursor:pointer; color:#9ca3af; font-size:16px; line-height:1; border:none; background:none; padding:0 2px; }
  .toast-close:hover { color:#111827; }
  .toast-body { margin-top:6px; line-height:1.45; }
  .toast-pair { color:#4b5563; font-size:12px; margin-top:4px; }
  .toast-options { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .opt-chip {
    background:#f3f4f6; border:1px solid #e5e7eb; border-radius:999px;
    padding:3px 10px; font-size:12px; color:#374151;
  }
  @keyframes slideIn { from { opacity:0; transform: translateX(20px);} to {opacity:1; transform:none;} }
  #loadstatus {
    position:fixed; bottom:12px; left:12px; font-size:11px; color:#6b7280;
    background:#fff; border:1px solid #e5e7eb; padding:4px 8px; border-radius:6px; z-index:9998;
  }
  #topbar button#convertBtn { background:#2563eb; border-color:#1d4ed8; }
  #topbar button#convertBtn:hover { background:#1d4ed8; }
  #adl-panel {
    position:fixed; top:60px; left:16px; z-index:9999; width:340px; max-width:85vw;
    background:#fff; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,0.15);
    font-size:13px; color:#111827; display:none;
  }
  #adl-panel.show { display:block; }
  #adl-panel .head {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; border-bottom:1px solid #e5e7eb; font-weight:700;
  }
  #adl-panel .head.error { color:#b91c1c; }
  #adl-panel .head.ok { color:#15803d; }
  #adl-panel .close { cursor:pointer; color:#9ca3af; background:none; border:none; font-size:16px; }
  #adl-panel .body { padding:10px 12px; max-height:320px; overflow:auto; }
  #adl-panel .summary { margin-bottom:8px; color:#374151; }
  #adl-panel .logline { font-size:11.5px; color:#6b7280; padding:2px 0; border-top:1px dashed #f3f4f6; }
  #adl-panel .logline.warn { color:#b45309; }
</style>

</head>
<body>

<div id="topbar">
  <div class="title">4EM Draw.io Live Validator</div>
  <div>
    <span class="status" id="statusText">Loading editor…</span>
    <button id="downloadBtn">Download .drawio.xml</button>
    <button id="convertBtn">Convert to ADL &amp; Download</button>
  </div>
</div>

<div id="frame-wrap">
  <iframe id="drawioFrame"

  </iframe>
</div>

<div id="toast-container"></div>
<div id="loadstatus">Stencils: loading…</div>

<div id="adl-panel">

    <button class="close" id="adl-panel-close">&times;</button>
  </div>
  <div class="body" id="adl-panel-body"></div>

var BLANK_MARKERS = ["-", " ", ""];

function isBlankLabel(s) {
  if (s === undefined || s === null) return true;
  var t = String(s).trim();
  return t === "" || BLANK_MARKERS.indexOf(t) !== -1;
}

// Types that belong specifically to the Actors & Resources model core set.
// Mirrors the professor's macro special-case: within this model, an
// unlabeled "-" connector is always acceptable between its own node types.
var ACTORS_RESOURCES_CORE = ["Role", "Individual", "Resource", "Organizational Unit"];

function lookupAllowed(fromType, toType) {
  var forward = [];
  var backward = [];
  for (var i = 0; i < RELATIONS.length; i++) {
    var r = RELATIONS[i][0], a = RELATIONS[i][1], b = RELATIONS[i][2];
    if (a === fromType && b === toType) forward.push(r);
    else if (a === toType && b === fromType) backward.push(r);
  }
  if (forward.length > 0) return { list: forward, swapped: false };
  if (backward.length > 0) return { list: backward, swapped: true };
  return { list: [], swapped: false };
}

function validateConnection(fromType, toType, label) {
  var result = lookupAllowed(fromType, toType);
  var allowed = result.list;

  // Actors & Resources special case: "-" always allowed between its own core types
  if (ACTORS_RESOURCES_CORE.indexOf(fromType) !== -1 && ACTORS_RESOURCES_CORE.indexOf(toType) !== -1) {
    if (allowed.indexOf("-") === -1) allowed = allowed.concat(["-"]);
  }

  if (allowed.length === 0) {
    return { valid: false, noRuleAtAll: true, options: [] };
  }

  var hasBlankOption = allowed.some(isBlankLabel);
  var namedOptions = allowed.filter(function(r){ return !isBlankLabel(r); });

  if (isBlankLabel(label)) {
    return { valid: hasBlankOption, noRuleAtAll: false, options: namedOptions, blankOk: hasBlankOption };
  }

  var labelNorm = String(label).trim().toLowerCase();
  var match = namedOptions.some(function(r){ return r.trim().toLowerCase() === labelNorm; });
  return { valid: match, noRuleAtAll: false, options: namedOptions, blankOk: hasBlankOption };
}

// Checks an intermodel (or still-ambiguous) relation's label against the
// same 349-triple rulebook the live validator uses - closes the gap where
// intermodel relations previously passed straight through to the ADL file
// unchecked (4EM would then silently substitute its own default relation
// type for anything it didn't recognize). Returns {type, description, note}.
function validateIntermodelRelation(fromType, toType, label) {
  var allowed = lookupAllowed(fromType, toType).list;

  if (allowed.length === 0) {
    // No rule defined for this pair at all - nothing to validate against.
    return { type: label || "", description: "", note: null };
  }

  var hasBlankOption = allowed.some(isBlankLabel);
  var namedOptions = allowed.filter(function(r){ return !isBlankLabel(r); });

  if (isBlankLabel(label)) {
    if (hasBlankOption || namedOptions.length === 0) {
      return { type: label || "", description: "", note: null };
    }
    var optsStr1 = Array.from(new Set(namedOptions)).sort().join(", ") || "(none)";
    return {
      type: "", description: "",
      note: "relation has no label but a Type is expected for '" + fromType + "' -> '" + toType +
        "' (possible values: " + optsStr1 + "); left Type blank",
    };
  }

  var labelNorm = String(label).trim().toLowerCase();
  if (namedOptions.some(function(r){ return r.trim().toLowerCase() === labelNorm; })) {
    return { type: label, description: "", note: null };
  }

  var optsStr2 = Array.from(new Set(namedOptions)).sort().join(", ") || "(none)";
  return {
    type: "", description: label,
    note: "relation Type '" + label + "' is not a valid connection between '" + fromType +
      "' and '" + toType + "' (possible values: " + optsStr2 + "); moved into Description and left Type blank",
  };
}

function pxToCm(px) {
  // Match Python's round(x,1) which always renders with one decimal place
  // (e.g. 22.0, not 22) when converted to a string in an f-string.
  var v = Math.round((parseFloat(px) / CONVERTER_DATA.PX_PER_CM) * 10) / 10;
  return v.toFixed(1);
}

function stripHtmlAdl(text) {
  if (!text) return "";
  var div = (typeof document !== "undefined") ? document.createElement("div") : null;
  var t = String(text);
  if (div) {
    div.innerHTML = t; // decodes entities
    t = div.textContent || div.innerText || "";
  } else {
    // Node fallback (no DOM): minimal entity decode
    t = t.replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  }
  t = t.replace(/<[^>]+>/g, "");
  t = t.replace(/\u00a0/g, " ");
  return t.trim();
}

var _anonCounters = {};
function makeAnonName(nodeType) {
  _anonCounters[nodeType] = (_anonCounters[nodeType] || 0) + 1;
  return nodeType + "-" + _anonCounters[nodeType];

function normalizeCells(graphRootEl) {
  var entries = [];
  var children = graphRootEl.childNodes;
  for (var i = 0; i < children.length; i++) {
    var child = children[i];
    if (child.nodeType !== 1) continue; // element nodes only
    var tag = child.tagName;
    if (tag === "mxCell") {
      entries.push({
        id: child.getAttribute("id"),
        value: stripHtmlAdl(child.getAttribute("value")),
        em_type: null,
        tooltip: child.getAttribute("tooltip"),
        style: child.getAttribute("style") || "",
        vertex: child.getAttribute("vertex"),
        edge: child.getAttribute("edge"),
        parent: child.getAttribute("parent"),
        source: child.getAttribute("source"),
        target: child.getAttribute("target"),
        geometry: child.getElementsByTagName("mxGeometry")[0] || null,
      });
    } else if (tag === "UserObject" || tag === "object") {
      var inner = child.getElementsByTagName("mxCell")[0];
      if (!inner) continue;
      entries.push({
        id: child.getAttribute("id"),
        value: stripHtmlAdl(child.getAttribute("label")),
        em_type: child.getAttribute("em_type"),
        tooltip: child.getAttribute("tooltip"),
        // Sub-type overrides baked into specific stencil variants (Rule's
        // 4 types, IS Requirement's 2 types, Unspecific/Product/Service's
        // 3 types) - null for any shape that doesn't carry that attribute.
        problem_type: child.getAttribute("problem_type"),
        rule_type: child.getAttribute("rule_type"),
        req_type: child.getAttribute("req_type"),
        specification: child.getAttribute("specification"),
        style: inner.getAttribute("style") || "",
        vertex: inner.getAttribute("vertex"),
        edge: inner.getAttribute("edge"),
        parent: inner.getAttribute("parent"),
        source: inner.getAttribute("source"),
        target: inner.getAttribute("target"),
        geometry: inner.getElementsByTagName("mxGeometry")[0] || null,
      });
    }
  }
  return entries;
}

function detectModelType(nodes) {
  var votes = {};
  var ambiguous = CONVERTER_DATA.AMBIGUOUS_NODE_TYPES;
  var nodeTypeToModel = CONVERTER_DATA.NODE_TYPE_TO_MODEL;

  Object.keys(nodes).forEach(function(id) {
    var ntype = nodes[id].type;
    if (ambiguous.indexOf(ntype) !== -1) return;
    var model = nodeTypeToModel[ntype];
    if (model) votes[model] = (votes[model] || 0) + 1;
  });

  if (Object.keys(votes).length === 0) {
    Object.keys(nodes).forEach(function(id) {
      var model = nodeTypeToModel[nodes[id].type];
      if (model) votes[model] = (votes[model] || 0) + 1;
    });
  }

  if (Object.keys(votes).length === 0) return { model: null, votes: votes };

  var best = null, bestCount = -1;
  Object.keys(votes).forEach(function(m) {
    if (votes[m] > bestCount) { best = m; bestCount = votes[m]; }
  });
  return { model: best, votes: votes };
}

function parseDrawio(xmlDoc, log) {
  _anonCounters = {};
  var graphRoot = xmlDoc.getElementsByTagName("root")[0];
  if (!graphRoot) throw new Error("Could not find <root> element in draw.io file");

  var allCells = normalizeCells(graphRoot);

  var edgeIds = {};
  allCells.forEach(function(c) { if (c.edge === "1") edgeIds[c.id] = true; });

  var nodes = {};
  var edges = [];
  var edgeLabels = {};
  var unknownTypes = {};
  var nextIndex = 1;

  var BARE_LABEL_TYPES = CONVERTER_DATA.BARE_LABEL_TYPES;
  var ANONYMOUS_NODE_TYPES = CONVERTER_DATA.ANONYMOUS_NODE_TYPES;
  var NODE_TYPE_TO_MODEL = CONVERTER_DATA.NODE_TYPE_TO_MODEL;

  allCells.forEach(function(cell) {
    if (cell.edge === "1") {
      edges.push({
        id: cell.id,
        source: cell.source,
        target: cell.target,
        label: (cell.value || "").trim(),
      });
    } else if (cell.vertex === "1") {
      var style = cell.style || "";
      var parent = cell.parent;
      var value = (cell.value || "").trim();

      if (style.indexOf("edgeLabel") !== -1 || edgeIds[parent]) {
        edgeLabels[parent] = value;
        return;
      }

      var emType = (cell.em_type || "").trim();
      var ntype, name;

      if (emType) {
        ntype = emType;
        var customName = (value && value !== emType) ? value : null;
        if (customName) {
          name = customName;
        } else if (ANONYMOUS_NODE_TYPES.indexOf(ntype) !== -1) {
          name = makeAnonName(ntype);
        } else {
          name = emType;
        }
      } else if (BARE_LABEL_TYPES.indexOf(value) !== -1) {
        if (ANONYMOUS_NODE_TYPES.indexOf(value) !== -1) {
          ntype = value; name = makeAnonName(value);
        } else {
          ntype = value; name = value;
        }
      } else if (value.indexOf(":") !== -1) {
        var parts = value.split(":");
        ntype = parts.shift().trim();
        name = parts.join(":").trim();
      } else {
        ntype = "Unknown"; name = value;
        if (log) log.push("WARNING: node '" + value + "' has no 'Type: Name' format and no em_type attribute");
      }

      if (!(ntype in NODE_TYPE_TO_MODEL) && ntype !== "Unknown") {
        unknownTypes[ntype] = true;
      }

      // Unspecific/Product/Service nodes carry a "Specification" attribute
      // 4EM needs set to exactly one of Unspecific/Product/Service. A
      // dedicated stencil variant (baked "specification" attribute) is
      // read directly; the older bracket-tag convention, e.g.
      // "Website [Product]" (case-insensitive, stripped from the name),
      // still works as a fallback if that attribute isn't present.
      var specification = cell.specification || null;
      if (ntype === "Unspecific/Product/Service" && !specification) {
        var specMatch = name.match(/\[\s*(unspecific|product|service)\s*\]\s*$/i);
        if (specMatch) {
          specification = specMatch[1].charAt(0).toUpperCase() + specMatch[1].slice(1).toLowerCase();
          name = name.slice(0, specMatch.index).trim();
        }
      }

      // Sub-type overrides for Rule (4 types) and IS Requirement (2 types),
      // baked into their dedicated stencil variants the same way.
      var problemType = ntype === "Problem" ? (cell.problem_type || null) : null;
      var ruleType = ntype === "Rule" ? (cell.rule_type || null) : null;
      var reqType = ntype === "IS Requirement" ? (cell.req_type || null) : null;

      var geom = cell.geometry;
      var x = geom ? (geom.getAttribute("x") || 0) : 0;
      var y = geom ? (geom.getAttribute("y") || 0) : 0;
      var w = geom ? (geom.getAttribute("width") || 0) : 0;
      var h = geom ? (geom.getAttribute("height") || 0) : 0;

      var description = (cell.tooltip || "").trim();
      description = stripHtmlAdl(description);
      description = description.replace(/"/g, "'");

      nodes[cell.id] = {
        type: ntype,
        name: name,
        specification: specification,
        problemType: problemType,
        ruleType: ruleType,
        reqType: reqType,
        description: description,
        x: pxToCm(x), y: pxToCm(y), w: pxToCm(w), h: pxToCm(h),
        index: nextIndex,
      };
      nextIndex++;
    }
  });

  if (Object.keys(unknownTypes).length && log) {
    log.push("WARNING: unrecognized node type(s) " + Object.keys(unknownTypes).sort().join(", "));
  }

  edges.forEach(function(e) {
    if (!e.label) {
      e.label = edgeLabels[e.id] || "";
      if (!e.label && log) {
        log.push("WARNING: edge " + e.id + " (source=" + e.source + ", target=" + e.target + ") has no label/relation type");
      }
    }
  });

  return { nodes: nodes, edges: edges };
}

// ----------------------------------------------------------------------------
// Validation
// ----------------------------------------------------------------------------

function validateRelationType(modelType, label, log, ctx) {
  if (!label) return { type: label, description: "" };

  var enumSet = CONVERTER_DATA.RELATION_TYPE_ENUM[modelType];
  if (!enumSet) return { type: label, description: "" };

  if (enumSet.indexOf(label) !== -1) return { type: label, description: "" };

  for (var i = 0; i < enumSet.length; i++) {
    if (label.toLowerCase() === enumSet[i].toLowerCase()) {
      if (log) log.push("NOTE: auto-corrected relation Type '" + label + "' -> '" + enumSet[i] + "' (case mismatch with 4EM enum)" + (ctx ? " (relation: " + ctx + ")" : ""));
      return { type: enumSet[i], description: "" };
    }
  }

  if (log) log.push("NOTE: relation Type '" + label + "' is not a confirmed valid value for '" + modelType + "' (known values: " + enumSet.join(", ") + "). Moved into Description, Type left blank." + (ctx ? " (relation: " + ctx + ")" : ""));
  return { type: "", description: label };
}

// ----------------------------------------------------------------------------
// Emission
// ----------------------------------------------------------------------------

function emitInstance(n, posOverride) {
  var attrs = CONVERTER_DATA.TYPE_ATTRS[n.type] || CONVERTER_DATA.COMMON_ATTRS;
  var out = [];
  var px = posOverride ? posOverride.x : n.x;
  var py = posOverride ? posOverride.y : n.y;
  out.push("INSTANCE <" + n.name + "> : <" + n.type + ">");
  out.push("");

  attrs.forEach(function(pair) {
    var attrName = pair[0], def = pair[1];
    out.push("\tATTRIBUTE <" + attrName + ">");
    if (attrName === "Intermodel-Relations") {
      out.push("\tVALUE");
      var records = n.intermodelRecords || [];
      records.forEach(function(rec, i) {
        out.push("\t\tRECORD");
        out.push("\t\t\tATTRIBUTE <Type>");
        out.push('\t\t\tVALUE "' + rec.type + '"');
        out.push("");
        out.push("\t\t\tATTRIBUTE <interref>");
        out.push('\t\t\tVALUE "REF mt:\\"' + rec.mt + '\\" m:\\"' + rec.m + '\\" c:\\"' + rec.c + '\\" i:\\"' + rec.i + '\\"');
        out.push('"');
        out.push("\t\tEND");
        out.push("");
      });
      if (records.length) out.push("");
    } else if (attrName === "Specification" && n.specification) {
      out.push('\tVALUE "' + n.specification + '"');
      out.push("");
    } else if (attrName === "Type" && n.type === "Rule" && n.ruleType) {
      out.push('\tVALUE "' + n.ruleType + '"');
      out.push("");
    } else if (attrName === "Type" && n.type === "IS Requirement" && n.reqType) {
      out.push('\tVALUE "' + n.reqType + '"');
      out.push("");
    } else if (attrName === "type" && n.type === "Problem" && n.problemType) {
      out.push('\tVALUE "' + n.problemType + '"');
      out.push("");
    } else if (def === "__POSITION__") {
      out.push('\tVALUE "NODE x:' + px + 'cm y:' + py + 'cm w:' + n.w + 'cm h:' + n.h + 'cm index:' + n.index + '"');
      out.push("");
    } else if (def === "__POSITION_NO_WH__") {
      out.push('\tVALUE "NODE x:' + px + 'cm y:' + py + 'cm index:' + n.index + '"');
      out.push("");
    } else if (def === "__DESCRIPTION__") {
      out.push('\tVALUE "' + n.description + '"');
      out.push("");
    } else if (def === "__INTEGER__") {
      out.push("\tVALUE 0");
      out.push("");
    } else if (def === null) {
      out.push("\tVALUE");
      out.push("");
    } else if (def === "") {
      out.push('\tVALUE ""');
      out.push("");
    } else {
      out.push('\tVALUE "' + def + '"');
      out.push("");
    }
  });

  out.push("");
  return out.join("\n");
}

function emitRelation(src, tgt, label, idx, description) {
  description = description || "";
  var out = [];
  out.push("RELATION <4EM_Relation>");
  out.push("\tFROM <" + src.name + "> : <" + src.type + ">");
  out.push("\tTO <" + tgt.name + "> : <" + tgt.type + ">");
  out.push("");
  out.push("\tATTRIBUTE <Positions>");
  out.push('\tVALUE "EDGE 0 index:' + idx + '"');
  out.push("");
  out.push("\tATTRIBUTE <Type>");
  out.push('\tVALUE "' + label + '"');
  out.push("");
  out.push("\tATTRIBUTE <Description>");
  out.push('\tVALUE "' + description + '"');
  out.push("");
  out.push("\tATTRIBUTE <IR>");
  out.push('\tVALUE "False"');
  out.push("");
  out.push("");
  return out.join("\n");
}

// ----------------------------------------------------------------------------
// Main conversion entry point
// ----------------------------------------------------------------------------

function convertXmlToAdl(xmlString, options) {
  options = options || {};
  var log = [];
  var parser = new DOMParser();
  var xmlDoc = parser.parseFromString(xmlString, "text/xml");
  var perr = xmlDoc.getElementsByTagName("parsererror");
  if (perr && perr.length) {
    throw new Error("Could not parse diagram XML: " + perr[0].textContent);
  }

  var parsed = parseDrawio(xmlDoc, log);
  var nodes = parsed.nodes, edges = parsed.edges;

  var detection = detectModelType(nodes);
  var finalType;
  if (options.modelType) {
    finalType = options.modelType;
    if (detection.model && detection.model !== options.modelType) {
      log.push("NOTE: auto-detected '" + detection.model + "' but using '" + options.modelType + "' as requested");
    }
  } else if (detection.model) {
    finalType = detection.model;
    log.push("Auto-detected model type: '" + finalType + "' (votes: " + JSON.stringify(detection.votes) + ")");
  } else {
    finalType = "Goal Model";
    log.push("WARNING: could not auto-detect model type from node labels; defaulting to '" + finalType + "'.");
  }

  var finalName = options.modelName || CONVERTER_DATA.DEFAULT_MODEL_NAME[finalType] || "4EM_Model";

  var lines = [];
  lines.push("VERSION <4.0>");
  lines.push("");
  lines.push("");
  lines.push("BUSINESS PROCESS MODEL <" + finalName + "> : <4EM 2.7>");
  lines.push("VERSION <>");
  lines.push("TYPE <" + finalType + ">");
  lines.push("");
  lines.push("\tATTRIBUTE <Author>");
  lines.push('\tVALUE "Converter"');
  lines.push("");
  lines.push("\tATTRIBUTE <Model type>");
  lines.push('\tVALUE "Current model"');
  lines.push("");
  lines.push("\tATTRIBUTE <Description>");
  lines.push('\tVALUE "Converted from draw.io"');
  lines.push("");
  lines.push("");

  Object.keys(nodes).forEach(function(id) {
    lines.push(emitInstance(nodes[id]));
  });

  var FLOW_CONNECTOR_NODE_TYPES = CONVERTER_DATA.FLOW_CONNECTOR_NODE_TYPES;

  edges.forEach(function(e, i) {
    var idx = i + 1;
    var src = nodes[e.source];
    var tgt = nodes[e.target];
    if (!src || !tgt) {
      log.push("WARNING: skipping edge with missing endpoint: " + JSON.stringify(e));
      return;
    }

    var correctedType, correctedDesc;
    if (FLOW_CONNECTOR_NODE_TYPES.indexOf(src.type) !== -1 || FLOW_CONNECTOR_NODE_TYPES.indexOf(tgt.type) !== -1) {
      if (e.label) {
        log.push("NOTE: clearing relation Type '" + e.label + "' -> '' (edges to/from Split/Join/PartOF connectors must be unlabeled in 4EM) for " + src.name + " -> " + tgt.name);
      }
      correctedType = ""; correctedDesc = "";
    } else {
      var res = validateRelationType(finalType, e.label, log, src.name + " -> " + tgt.name);
      correctedType = res.type; correctedDesc = res.description;
    }
    lines.push(emitRelation(src, tgt, correctedType, idx, correctedDesc));
  });

  var adlText = lines.join("\n");
  return {
    adl: adlText,
    modelType: finalType,
    modelName: finalName,
    nodeCount: Object.keys(nodes).length,
    edgeCount: edges.length,
    log: log,
  };
}

// ----------------------------------------------------------------------------
// Multi-view conversion: one block per populated sub-model (intra-model
// relations only) + a "[view] 4EM_General" block containing every node
// (union) and every relation, including intermodel ones whose endpoints
// belong to two different sub-models.
//
// This mirrors the real 4EM export format: the same INSTANCE <Name> : <Type>
// is declared once per view it appears in, matched by 4EM on (name, type).
// A node's per-model "index" attribute is computed once and reused
// identically in every view it appears in (confirmed from a real 4EM
// export); a relation's index is a simple per-block counter (4EM does not
// require these to match any particular scheme across views).
// ----------------------------------------------------------------------------

var MODEL_ORDER = Object.keys(CONVERTER_DATA.DEFAULT_MODEL_NAME);

function convertXmlToMultiViewAdl(xmlString) {
  var log = [];
  var parser = new DOMParser();
  var xmlDoc = parser.parseFromString(xmlString, "text/xml");
  var perr = xmlDoc.getElementsByTagName("parsererror");
  if (perr && perr.length) {
    throw new Error("Could not parse diagram XML: " + perr[0].textContent);
  }

  var parsed = parseDrawio(xmlDoc, log);
  var nodes = parsed.nodes, edges = parsed.edges;
  var nodeIds = Object.keys(nodes);
  var FLOW_CONNECTOR_NODE_TYPES = CONVERTER_DATA.FLOW_CONNECTOR_NODE_TYPES;
  var TYPE_TO_MODELS = CONVERTER_DATA.TYPE_TO_MODELS;

  // 1. Resolve each node's single home model by propagating through its
  //    relations, rather than a fixed type->model lookup. Many node types
  //    (KPI, Goal, Problem, AND/OR/AND-OR, Development Action, Comment,
  //    Assumption, ISA/PartOF connectors, ...) are legitimately used in
  //    more than one of the 7 sub-models - which one a given node "lives
  //    in" depends on what it's actually connected to, confirmed against
  //    a real 4EM export where two KPI nodes of the identical type ended
  //    up in two different views based on their relations (one measuring
  //    a Goal, one referring to a Concept). Every node in that real
  //    export has exactly one true home model - never two - so home[] is
  //    a single value per node, not a set.
  //
  //    candidate[id] = every model that node's type is used in at all
  //    home[id]      = the one model actually pinned down by its edges
  //
  //    IMPORTANT: an edge only ever pins a model down when it narrows
  //    things to EXACTLY one shared candidate. Two nodes that are BOTH
  //    still ambiguous (e.g. a Goal and an AND connector, which both list
  //    Goal Model *and* Technical Components as candidates) must NOT
  //    resolve each other just because their candidate lists overlap by
  //    more than one model - that's not actually a resolved answer, and
  //    committing it anyway causes chains of Goal/Problem/AND/OR/AND-OR
  //    nodes to all incorrectly pick up a second, unintended home in
  //    Technical Components and Requirements Model.
  var candidate = {};
  var home = {};
  nodeIds.forEach(function(id) {
    candidate[id] = TYPE_TO_MODELS[nodes[id].type] || [];
    home[id] = null;
  });

  function belief(id) {
    return home[id] ? [home[id]] : candidate[id];
  }

  var validEdges = edges.filter(function(e) { return nodes[e.source] && nodes[e.target]; });

  // Fixed-point propagation: repeating this lets a genuine anchor (e.g. a
  // Constraint, unambiguously Goal Model) propagate through a chain of
  // otherwise-ambiguous types (Goal, AND, OR, ...) to pin all of them
  // down correctly, one exactly-one-shared-model edge at a time.
  var changed = true, pass = 0;
  while (changed && pass < 10) {
    changed = false;
    pass++;
    validEdges.forEach(function(e) {
      var a = belief(e.source), b = belief(e.target);
      var overlap = a.filter(function(m) { return b.indexOf(m) !== -1; });
      if (overlap.length === 1) {
        var m = overlap[0];
        if (!home[e.source]) { home[e.source] = m; changed = true; }
        if (!home[e.target]) { home[e.target] = m; changed = true; }
      }
    });
  }

  // Fallback for nodes that never got pinned down (isolated ambiguous
  // nodes, or connected only to other equally-unresolved ambiguous nodes).
  nodeIds.forEach(function(id) {
    var n = nodes[id];
    if (home[id]) return;
    if (candidate[id].length === 0) {
      log.push("WARNING: node '" + n.name + "' has unrecognized type '" + n.type + "'; excluded from all views");
    } else if (candidate[id].length === 1) {
      home[id] = candidate[id][0];
    } else {
      home[id] = candidate[id][0];
      log.push("NOTE: node '" + n.name + "' (type '" + n.type + "') is used in more than one 4EM model (" +
        candidate[id].join(", ") + ") and isn't connected to anything that pins down which one; defaulting to '" +
        candidate[id][0] + "'. Connect it to a node from the intended model if this isn't right.");
    }
  });

  nodeIds.forEach(function(id) {
    nodes[id].homeModel = home[id];
  });

  // Assign each node one persistent index, from a counter on its home
  // model - reused identically in every view/block that node appears in
  // (confirmed against a real 4EM export: the same node keeps the same
  // index/position across views).
  var perModelCounter = {};
  MODEL_ORDER.forEach(function(m) { perModelCounter[m] = 0; });
  nodeIds.forEach(function(id) {
    var n = nodes[id];
    if (!n.homeModel) return;
    perModelCounter[n.homeModel]++;
    n.index = perModelCounter[n.homeModel];
  });

  // 2. Resolve each edge by comparing its two (now-resolved) endpoints'
  //    single home model. Same model -> a normal intra-model relation.
  //    Different models -> a genuine intermodel relation (General view
  //    only), and recorded onto the source node's Intermodel-Relations.
  var intraByModel = {};
  MODEL_ORDER.forEach(function(m) { intraByModel[m] = []; });
  var interModel = [];

  edges.forEach(function(e) {
    var src = nodes[e.source], tgt = nodes[e.target];
    if (!src || !tgt) {
      log.push("WARNING: skipping edge with missing endpoint: " + JSON.stringify(e));
      return;
    }
    if (!src.homeModel || !tgt.homeModel) {
      log.push("WARNING: skipping edge (unrecognized endpoint type): " + src.name + " -> " + tgt.name);
      return;
    }

    var ctx = src.name + " -> " + tgt.name;
    var sameModel = src.homeModel === tgt.homeModel;

    var isFlowConn = FLOW_CONNECTOR_NODE_TYPES.indexOf(src.type) !== -1 ||
                      FLOW_CONNECTOR_NODE_TYPES.indexOf(tgt.type) !== -1;
    var correctedType, correctedDesc;

    if (isFlowConn) {
      if (e.label) {
        log.push("NOTE: clearing relation Type '" + e.label + "' -> '' (edges to/from Split/Join/PartOF connectors must be unlabeled in 4EM) for " + ctx);
      }
      correctedType = ""; correctedDesc = "";
    } else if (sameModel) {
      var res = validateRelationType(src.homeModel, e.label, log, ctx);
      correctedType = res.type; correctedDesc = res.description;
    } else {
      // Intermodel relation: no per-model enum applies at this granularity,
      // but the professor's from-to rulebook does - the same check the live
      // draw.io validator runs, now applied here too so an invalid label
      // gets caught and moved into Description instead of being written
      // into the ADL as a raw Type value that 4EM would then silently
      // substitute with its own default.
      var interRes = validateIntermodelRelation(src.type, tgt.type, e.label);
      correctedType = interRes.type; correctedDesc = interRes.description;
      if (interRes.note) log.push("NOTE: " + interRes.note + " (relation: " + ctx + ")");
    }

    var entry = { src: src, tgt: tgt, type: correctedType, desc: correctedDesc };
    if (sameModel) {
      intraByModel[src.homeModel].push(entry);
    } else {
      interModel.push(entry);
      log.push("NOTE: intermodel relation '" + (e.label || "(unlabeled)") + "' (" + ctx + ") only added to [view] 4EM_General, since its endpoints belong to different sub-models");
      if (!src.intermodelRecords) src.intermodelRecords = [];
      src.intermodelRecords.push({
        type: correctedType,
        mt: tgt.homeModel,
        m: CONVERTER_DATA.DEFAULT_MODEL_NAME[tgt.homeModel] || tgt.homeModel,
        c: tgt.type,
        i: tgt.name,
      });
    }
  });

  function modelBlockHeader(blockName, typeStr, description) {
    return [
      "BUSINESS PROCESS MODEL <" + blockName + "> : <4EM 2.7>",
      "VERSION <>",
      "TYPE <" + typeStr + ">",
      "",
      "\tATTRIBUTE <Author>",
      '\tVALUE "Converter"',
      "",
      "\tATTRIBUTE <Model type>",
      '\tVALUE "Current model"',
      "",
      "\tATTRIBUTE <Description>",
      '\tVALUE "' + description + '"',
      "",
      "",
    ];
  }

  var blocks = [];
  var viewSummaries = [];

  // 3. One block per populated sub-model, intra-model relations only.
  //    Each node belongs to exactly one of these.
  MODEL_ORDER.forEach(function(modelType) {
    var modelNodes = nodeIds.map(function(id){return nodes[id];})
      .filter(function(n){ return n.homeModel === modelType; });
    if (modelNodes.length === 0) return; // skip empty views, matches real export behavior

    var blockName = CONVERTER_DATA.DEFAULT_MODEL_NAME[modelType];
    var lines = modelBlockHeader(blockName, modelType, "Converted from draw.io");

    // Individual views get their own self-contained layout: shift this
    // model's cluster so its top-left corner starts near the view's
    // origin, regardless of where you physically drew that cluster on
    // the shared draw.io canvas. (The General view below keeps your
    // original absolute layout, since that's where the clustering/spacing
    // you actually drew is meant to be visible.)
    var minX = Math.min.apply(null, modelNodes.map(function(n){ return n.x; }));
    var minY = Math.min.apply(null, modelNodes.map(function(n){ return n.y; }));
    var MARGIN_CM = 5;

    modelNodes.forEach(function(n) {
      lines.push(emitInstance(n, {
        x: Math.round((n.x - minX + MARGIN_CM) * 10) / 10,
        y: Math.round((n.y - minY + MARGIN_CM) * 10) / 10,
      }));
    });
    intraByModel[modelType].forEach(function(rel, i) {
      lines.push(emitRelation(rel.src, rel.tgt, rel.type, i + 1, rel.desc));
    });

    blocks.push(lines.join("\n"));
    viewSummaries.push(blockName + " (" + modelType + "): " + modelNodes.length + " nodes, " + intraByModel[modelType].length + " relations");
  });

  // 4. [view] 4EM_General: union of every recognized node + every relation
  //    (intra-model relations in their original per-model order, then
  //    intermodel/ambiguous relations).
  {
    var lines = modelBlockHeader("[view] 4EM_General", "4EM General Model", "Union of all models with intermodel relations");
    var includedNodes = nodeIds.map(function(id){return nodes[id];}).filter(function(n){ return !!n.homeModel; });
    includedNodes.forEach(function(n) { lines.push(emitInstance(n)); });

    var allRels = [];
    MODEL_ORDER.forEach(function(m) { allRels = allRels.concat(intraByModel[m]); });
    allRels = allRels.concat(interModel);
    allRels.forEach(function(rel, i) {
      lines.push(emitRelation(rel.src, rel.tgt, rel.type, i + 1, rel.desc));
    });

    blocks.push(lines.join("\n"));
    viewSummaries.push("[view] 4EM_General: " + includedNodes.length + " nodes, " + allRels.length + " relations (" + interModel.length + " intermodel)");
  }

  var header =
    "///////////////////////////////////////////////////////////////\n" +
    "//\n" +
    "// Generated by 4EM Draw.io Live Validator (browser-side converter)\n" +
    "//\n" +
    "// The file contains the following models:\n" +
    "//\n" +
    viewSummaries.map(function(s){ return "// " + s.split(":")[0]; }).join("\n") + "\n" +
    "//\n" +
    "///////////////////////////////////////////////////////////////\n\n" +
    "VERSION <4.0>\n\n\n";

  var adlText = header + blocks.join("\n");

  return {
    adl: adlText,
    log: log,
    views: viewSummaries,
    nodeCount: nodeIds.filter(function(id){ return !!nodes[id].homeModel; }).length,
    edgeCount: edges.length,
  };
}

/* =========================================================================
   2. STENCIL LIBRARIES (auto-loaded on start, from your GitHub repo)
   ========================================================================= */
var STENCIL_URLS = [
  "https://raw.githubusercontent.com/Akshay-offical/4EM/main/DrawioTo4em/generated_stencils/4EM_GoalModel_Stencil_v4.xml",
  "https://raw.githubusercontent.com/Akshay-offical/4EM/main/DrawioTo4em/generated_stencils/4EM_BusinessProcess_Stencil_v4.xml",
  "https://raw.githubusercontent.com/Akshay-offical/4EM/main/DrawioTo4em/generated_stencils/4EM_ActorsResources_Stencil_v4.xml",
  "https://raw.githubusercontent.com/Akshay-offical/4EM/main/DrawioTo4em/generated_stencils/4EM_Concepts_Stencil_v4.xml",
  "https://raw.githubusercontent.com/Akshay-offical/4EM/main/DrawioTo4em/generated_stencils/4EM_ProductService_Stencil_v4.xml",
  "https://raw.githubusercontent.com/Akshay-offical/4EM/main/DrawioTo4em/generated_stencils/4EM_Technical_Stencil_v4.xml",
  "https://raw.githubusercontent.com/Akshay-offical/4EM/main/DrawioTo4em/generated_stencils/4EM_BusinessRule_Stencil_v4.xml"
];

function buildDefaultCustomLibraries() {
  // raw.githubusercontent.com sits behind a CDN that caches by exact URL,
  // and browsers cache aggressively too - so a plain URL can keep serving
  // stale content for a while after you push an update to GitHub, even
  // though the origin file is already correct. Appending a fresh query
  // param on every page load makes each fetch a "new" URL as far as any
  // cache is concerned, so it's forced to go get the current content.
  var cacheBuster = "cb=" + Date.now();
  return STENCIL_URLS.map(function(u){
    var sep = u.indexOf("?") === -1 ? "?" : "&";
    return "U" + encodeURIComponent(u + sep + cacheBuster);
  });
}

/* =========================================================================
   3. DRAW.IO EMBED WIRING
   ========================================================================= */
var frame = document.getElementById("drawioFrame");
var statusText = document.getElementById("statusText");
var loadStatus = document.getElementById("loadstatus");
var lastXml = "";
var edgeSignatures = {}; // edgeId -> "sourceId|targetId|label" last validated

var EMPTY_DIAGRAM =
  '<mxGraphModel dx="800" dy="600" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="1100" pageHeight="850" math="0" shadow="0">' +
  '<root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel>';

window.addEventListener("message", function(evt) {
  var msg;
  try { msg = JSON.parse(evt.data); } catch (e) { return; }

  if (msg.event === "configure") {
    frame.contentWindow.postMessage(JSON.stringify({
      action: "configure",
      config: { defaultCustomLibraries: buildDefaultCustomLibraries() }
    }), "*");
    loadStatus.textContent = "Stencils: requested (7 libraries)";
  }
  else if (msg.event === "init") {
    frame.contentWindow.postMessage(JSON.stringify({
      action: "load",
      xml: EMPTY_DIAGRAM,
      autosave: 1
    }), "*");
    statusText.textContent = "Ready";
    loadStatus.textContent = "Stencils: loaded";
  }
  else if (msg.event === "autosave" || msg.event === "save") {
    if (msg.xml) {
      lastXml = msg.xml;
      checkDiagram(msg.xml);
    }
  }
  else if (msg.event === "export") {
    if (!msg.xml) return;
    if (pendingExportPurpose === "convert-adl") {
      runConversion(msg.xml);
    } else {
      triggerDownload(msg.xml, "diagram.drawio.xml", "application/xml");
    }
    pendingExportPurpose = null;
  }
});

// Tracks why we asked draw.io to export XML, since the export event itself
// doesn't tell us which button triggered it.
var pendingExportPurpose = null;

document.getElementById("downloadBtn").addEventListener("click", function() {
  pendingExportPurpose = "download-xml";
  frame.contentWindow.postMessage(JSON.stringify({
    action: "export", format: "xml", spinKey: "saving"
  }), "*");
});

document.getElementById("convertBtn").addEventListener("click", function() {
  pendingExportPurpose = "convert-adl";
  frame.contentWindow.postMessage(JSON.stringify({
    action: "export", format: "xml", spinKey: "converting"
  }), "*");
});

function triggerDownload(content, filename, mime) {
  var blob = new Blob([content], { type: mime || "text/plain" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function runConversion(xml) {
  var panel = document.getElementById("adl-panel");
  var headRow = document.getElementById("adl-panel-head-row");
  var head = document.getElementById("adl-panel-head");
  var body = document.getElementById("adl-panel-body");
  body.innerHTML = "";

  var result;
  try {
    result = convertXmlToMultiViewAdl(xml);
  } catch (err) {
    head.textContent = "Conversion failed";
    headRow.className = "head error";
    var p = document.createElement("div");
    p.className = "summary";
    p.textContent = String(err.message || err);
    body.appendChild(p);
    panel.classList.add("show");
    return;
  }

  head.textContent = "Converted to ADL (" + result.views.length + " views)";
  headRow.className = "head ok";

  var summary = document.createElement("div");
  summary.className = "summary";
  summary.textContent = result.nodeCount + " nodes, " + result.edgeCount + " relations total" +
    (result.log.length ? "  •  " + result.log.length + " note(s) below" : "");
  body.appendChild(summary);

  result.views.forEach(function(v) {
    var d = document.createElement("div");
    d.className = "logline";
    d.style.fontWeight = "600";
    d.style.color = "#1f2937";
    d.textContent = v;
    body.appendChild(d);
  });

  result.log.forEach(function(line) {
    var d = document.createElement("div");
    d.className = "logline" + (line.indexOf("WARNING") === 0 ? " warn" : "");
    d.textContent = line;
    body.appendChild(d);
  });

  panel.classList.add("show");

  triggerDownload(result.adl, "4EM_Model.adl", "text/plain");
}

document.getElementById("adl-panel-close").addEventListener("click", function() {
  document.getElementById("adl-panel").classList.remove("show");
});

/* =========================================================================
   4. DIAGRAM DIFF + VALIDATION
   ========================================================================= */
function stripHtml(s) {
  if (!s) return "";
  var withoutTags = String(s).replace(/<[^>]*>/g, "");
  var withoutNbsp = withoutTags.replace(/&nbsp;/g, " ").replace(/\u00a0/g, " ");
  var div = document.createElement("div");
  div.innerHTML = withoutNbsp;
  return div.textContent.trim();
}

function checkDiagram(xmlString) {
  var doc;
  try { doc = new DOMParser().parseFromString(xmlString, "text/xml"); }
  catch (e) { return; }
  if (!doc || doc.getElementsByTagName("parsererror").length) return;

  // Map of cell id -> em_type, from every UserObject wrapping a vertex
  var vertexTypes = {};
  var userObjects = doc.getElementsByTagName("UserObject");
  for (var i = 0; i < userObjects.length; i++) {
    var uo = userObjects[i];
    var emType = uo.getAttribute("em_type");
    if (!emType) continue;
    var innerCell = uo.getElementsByTagName("mxCell")[0];
    if (innerCell && innerCell.getAttribute("vertex") === "1") {
      vertexTypes[uo.getAttribute("id")] = emType;
    }
  }

  var edges = doc.getElementsByTagName("mxCell");
  for (var j = 0; j < edges.length; j++) {
    var cell = edges[j];
    if (cell.getAttribute("edge") !== "1") continue;

    var source = cell.getAttribute("source");
    var target = cell.getAttribute("target");
    if (!source || !target) continue; // not fully connected yet

    var fromType = vertexTypes[source];
    var toType = vertexTypes[target];
    if (!fromType || !toType) continue; // endpoint isn't a recognised 4EM stencil shape

    var edgeId = cell.getAttribute("id");
    var label = stripHtml(cell.getAttribute("value") || "");
    var signature = source + "|" + target + "|" + label;

    if (edgeSignatures[edgeId] === signature) continue; // already checked, unchanged
    edgeSignatures[edgeId] = signature;

    var result = validateConnection(fromType, toType, label);
    if (!result.valid) {
      showInvalidToast(fromType, toType, label, result);
    }
  }
}

/* =========================================================================
   5. TOAST UI
   ========================================================================= */
function showInvalidToast(fromType, toType, label, result) {
  var container = document.getElementById("toast-container");
  var toast = document.createElement("div");
  toast.className = "toast";

  var head = document.createElement("div");
  head.className = "toast-head";
  var title = document.createElement("div");
  title.className = "toast-title";
  title.textContent = "Connection not possible";
  var closeBtn = document.createElement("button");
  closeBtn.className = "toast-close";
  closeBtn.innerHTML = "&times;";
  closeBtn.onclick = function(){ container.removeChild(toast); };
  head.appendChild(title);
  head.appendChild(closeBtn);
  toast.appendChild(head);

  var pair = document.createElement("div");
  pair.className = "toast-pair";
  pair.textContent = fromType + "  →  " + toType +
    (label ? ("   (labeled: \"" + label + "\")") : "   (no label)");
  toast.appendChild(pair);

  var body = document.createElement("div");
  body.className = "toast-body";

  if (result.noRuleAtAll) {
    body.textContent = "No valid connections are defined between \"" + fromType + "\" and \"" + toType + "\" in the 4EM rulebook.";
  } else {
    body.textContent = "Possible connections are:";
  }
  toast.appendChild(body);

  if (!result.noRuleAtAll) {
    var opts = document.createElement("div");
    opts.className = "toast-options";
    var shown = {};
    result.options.forEach(function(o) {
      var key = o.trim().toLowerCase();
      if (shown[key]) return;
      shown[key] = true;
      var chip = document.createElement("span");
      chip.className = "opt-chip";
      chip.textContent = o;
      opts.appendChild(chip);
    });
    if (result.blankOk) {
      var chip2 = document.createElement("span");
      chip2.className = "opt-chip";
      chip2.textContent = "(no relation name needed)";
      opts.appendChild(chip2);
    }
    toast.appendChild(opts);
  }

  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) container.removeChild(toast);
  }, 12000);
}
